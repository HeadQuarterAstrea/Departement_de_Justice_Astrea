<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poste Fondation S.C.P.F — Installation 73</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{--bg:#0b0e11;--bg2:#12171c;--line:#252d34;--bone:#e9e6dd;--mute:#8a918d;--red:#c2352b;
--f-disp:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--f-serif:'Source Serif 4',Georgia,serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--bone);font-family:var(--f-serif);overflow:hidden}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.mono{font-family:var(--f-mono)}
.micro{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* ---------- Écran de connexion du poste ---------- */
#lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1.2rem;
 background:linear-gradient(180deg,#27094f 0%,#1c0a3a 50%,#120a1f 100%)}
#lock::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.25;mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent)}
.card{position:relative;width:min(26rem,100%);background:#150b29ee;border:1px solid #3a2766;border-top:3px solid var(--red);padding:2rem 1.8rem 1.6rem}
.mark{display:block;margin:0 auto 1rem}
.card h1{font-family:var(--f-disp);font-weight:900;text-transform:uppercase;font-size:2rem;letter-spacing:.05em;text-align:center;margin:0}
.card .sub{text-align:center;margin:.2rem 0 1.4rem}
label{display:block;margin:1rem 0 .3rem}
input{width:100%;background:#0b0f13;border:1px solid var(--line);padding:.7rem .8rem;font-family:var(--f-mono);font-size:.95rem;border-radius:0}
input:focus{outline:none;border-color:var(--red)}
.go{width:100%;margin-top:1.4rem;background:var(--bone);color:#0b0e11;border:0;padding:.8rem;font-family:var(--f-disp);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:1.05rem;cursor:pointer}
.go:hover{background:#fff}
#err{min-height:1.3rem;margin-top:.8rem;color:#e06a5f;font-family:var(--f-mono);font-size:.78rem}

/* ---------- Bureau ---------- */
#desk{position:fixed;inset:0;display:flex;flex-direction:column;
 background:linear-gradient(180deg,#27094f 0%,#1c0a3a 50%,#120a1f 100%)}
#desk::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:72px 72px;opacity:.14;pointer-events:none}
#wall{position:absolute;right:3rem;bottom:5.5rem;text-align:right;pointer-events:none}
#wall>b,#wall>span{opacity:.55}
#wall b{display:block;font-family:var(--f-disp);font-weight:900;font-size:clamp(2rem,5vw,4.4rem);line-height:.9;text-transform:uppercase;letter-spacing:.03em}
#icons{position:relative;flex:1;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:.4rem;padding:1.2rem;min-height:0}
.ico{width:6.8rem;padding:.6rem .3rem;background:none;border:1px solid transparent;text-align:center;cursor:pointer;border-radius:3px}
.ico:hover,.ico:focus-visible{background:#ffffff12;border-color:#ffffff22;outline:none}
.ico .pic{width:3.6rem;height:3.6rem;margin:0 auto .4rem;display:block;border-radius:50%;object-fit:cover;filter:drop-shadow(0 3px 6px #0008)}
.ico .gen{display:flex;align-items:center;justify-content:center;background:#1c242b;border:1px solid var(--line);font-family:var(--f-disp);font-weight:900;font-size:1.5rem}
.ico span{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;line-height:1.3;text-shadow:0 1px 3px #000}

/* ---------- Fenêtres ---------- */
.win{position:absolute;display:flex;flex-direction:column;background:#0e1216;border:1px solid #38444d;box-shadow:0 18px 50px #000b;min-width:20rem;min-height:12rem}
.win.max{left:0!important;top:0!important;width:100%!important;height:calc(100% - 3rem - env(safe-area-inset-bottom,0px))!important;border:0;box-shadow:none}
.win.min{display:none}
.tbar{display:flex;align-items:center;gap:.6rem;height:2.3rem;padding:0 .4rem 0 .7rem;background:#161c22;border-bottom:1px solid var(--line);cursor:move;user-select:none;flex:none}
.tbar img,.tbar .gi{width:1.2rem;height:1.2rem;border-radius:50%;object-fit:cover}
.tbar .t{flex:1;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar button{width:2.2rem;height:1.8rem;background:none;border:0;cursor:pointer;color:var(--mute);font-size:.95rem}
.tbar button:hover{background:#ffffff14;color:var(--bone)}
.tbar button.x:hover{background:var(--red);color:#fff}
.win iframe{flex:1;width:100%;border:0;background:#0e1114;min-height:0}
.win.drag iframe,.win.rsz iframe{pointer-events:none}
.grip{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize}
.win.max .grip{display:none}
.pane{padding:1.4rem;overflow:auto;flex:1}
.pane h2{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.05em;margin:0 0 .6rem}
.pane textarea{width:100%;background:#0b0f13;border:1px solid var(--line);color:var(--bone);font-family:var(--f-mono);font-size:.78rem;padding:.7rem;min-height:5rem;word-break:break-all}
.pane select{width:100%;background:#0b0f13;border:1px solid var(--line);padding:.7rem .8rem;font-family:var(--f-mono);font-size:.9rem;border-radius:0}
.pane .chk{display:flex;gap:.5rem;align-items:center;margin:.4rem 0;font-family:var(--f-mono);font-size:.82rem}
.pane .chk input{width:auto}

/* ---------- Barre des tâches ---------- */
#bar{position:relative;z-index:50000;height:3rem;flex:none;display:flex;align-items:stretch;gap:.2rem;background:#0d0719ee;border-top:1px solid #2f2154;padding:0 max(.5rem,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px)}
#start{background:none;border:0;padding:0 1rem;display:flex;align-items:center;gap:.6rem;cursor:pointer;font-family:var(--f-disp);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
#start:hover{background:#ffffff12}
#start i{width:.7rem;height:.7rem;background:var(--red);display:block;transform:rotate(45deg)}
#tasks{flex:1;display:flex;gap:.2rem;align-items:stretch;overflow:hidden;min-width:0}
.task{background:none;border:0;border-bottom:2px solid transparent;padding:0 .9rem;display:flex;align-items:center;gap:.5rem;cursor:pointer;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;max-width:12rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.task img{width:1.2rem;height:1.2rem;border-radius:50%}
.task.on{background:#ffffff10;border-bottom-color:var(--red)}
.task:hover{background:#ffffff18}
#tray{display:flex;align-items:center;gap:.9rem;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;white-space:nowrap}
#tray button{background:none;border:1px solid var(--line);padding:.3rem .6rem;cursor:pointer;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase}
#tray button:hover{background:#ffffff14}
#menu{max-height:calc(100vh - 4rem);overflow-y:auto;position:absolute;left:.4rem;bottom:3.3rem;z-index:50001;width:17rem;background:#10151a;border:1px solid #38444d;box-shadow:0 10px 40px #000c;padding:.4rem}
#menu .hd{padding:.7rem .8rem;border-bottom:1px solid var(--line);margin-bottom:.3rem}
#menu .hd b{display:block;font-family:var(--f-disp);font-size:1.2rem;letter-spacing:.06em;text-transform:uppercase}
#menu button{display:flex;width:100%;align-items:center;gap:.7rem;padding:.55rem .8rem;background:none;border:0;cursor:pointer;text-align:left;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}
#menu button:hover{background:#ffffff14}
.acc{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.bdg{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;padding:.2rem .45rem;border:1px solid var(--line);color:#5d665f;text-decoration:line-through}
.bdg.on{color:#7fd1a5;border-color:#2c7a58;text-decoration:none}
#menu img{width:1.4rem;height:1.4rem;border-radius:50%}

/* ---------- Téléphone ---------- */
@media (max-width:720px){
 #wall{display:none}
 .ico{width:5.6rem}
 .win{left:0!important;top:0!important;width:100%!important;height:calc(100% - 3rem - env(safe-area-inset-bottom,0px))!important;border:0}
 .grip{display:none}
 #tray .clk,#tray .who{display:none}
 .task{padding:0 .6rem}
}
</style>
</head>
<body>

<!-- Connexion du poste -->
<section id="lock">
  <form class="card" id="lf" autocomplete="off">
    <svg class="mark" width="76" height="76" viewBox="0 0 76 76" aria-hidden="true">
      <circle cx="38" cy="38" r="35" fill="none" stroke="#e9e6dd" stroke-width="2"/>
      <circle cx="38" cy="38" r="28" fill="none" stroke="#c2352b" stroke-width="1" stroke-dasharray="2 4"/>
      <path d="M38 17 55 47H21Z" fill="none" stroke="#e9e6dd" stroke-width="2"/>
      <circle cx="38" cy="39" r="5" fill="#c2352b"/>
    </svg>
    <h1>Fondation S.C.P.F</h1>
    <p class="micro sub">Poste de travail · Installation - 73</p>
    <label class="micro" for="u">Identifiant (matricule)</label>
    <input id="u" placeholder="JUS-73-0000" autocapitalize="none" spellcheck="false" required>
    <label class="micro" for="p">Mot de passe</label>
    <input id="p" type="password" required>
    <button class="go" type="submit">Ouvrir la session</button>
    <div id="err" role="alert"></div>
  </form>
</section>

<!-- Bureau -->
<section id="desk" hidden>
  <div id="icons"></div>
  <div id="wall"><span class="micro">Installation - 73</span><b id="wallname"></b><div class="acc" id="wallacc" style="justify-content:flex-end"></div></div>
  <div id="menu" hidden></div>
  <div id="bar">
    <button id="start"><i></i>Menu</button>
    <div id="tasks"></div>
    <div id="tray"><span class="who" id="who"></span><span class="clk" id="clk"></span><button id="fs">Plein écran</button><button id="out">Fermer la session</button></div>
  </div>
</section>

<script src="comptes-pc.js"></script>
<script src="liens.js"></script>
<script src="config.js"></script>
<script src="canaux.js"></script>
<script src="reseau.js"></script>
<script src="apps.js"></script>
<script>
/* ===== Applications du poste =====
   Une application = un département. "url" = le site du département (dossier du dépôt).
   Pour en ajouter un : un dossier avec son index.html, une entrée ici, et l'id dans "apps" du compte. */
var APPS = {
  justice:  { nom: "Justice", dept: "Département de Justice", hq: "Astrea",  url: "justice/index.html", icone: "justice/logo.png" },
  ethique:  { nom: "Éthique", dept: "Comité d'Éthique",       hq: "Ethos",   url: "ethos/index.html",   icone: "ethos/logo.png" }
};

/* Grades : mêmes grades que dans chaque application. "service" = département d'origine. */
var GRADES = {
  direction:   {l:"Direction de l'Installation", s:"direction", n:5},
  presidence:  {l:"Présidence Juridique", s:"justice", n:5},
  sec:         {l:"Cabinet Présidentielle", s:"justice", n:4},
  cour_pres:   {l:"Président de la Cour", s:"justice", n:4},
  juge:        {l:"Juge", s:"justice", n:3},
  greffier:    {l:"Greffier", s:"justice", n:2},
  be_dir:      {l:"Directeur du Bureau d'Enquête", s:"justice", n:3},
  be_sup:      {l:"Superviseur d'enquête", s:"justice", n:2},
  be_chef:     {l:"Chef d'enquête", s:"justice", n:2},
  be_enq:      {l:"Enquêteur", s:"justice", n:1},
  eap_dir:     {l:"Directeur de l'EAP", s:"justice", n:3},
  eap_sup:     {l:"Superviseur de l'EAP", s:"justice", n:2},
  eap_chef:    {l:"Chef d'équipe EAP", s:"justice", n:2},
  eap_agent:   {l:"Agent EAP", s:"justice", n:1},
  eth_pres:    {l:"Président du Comité d'Éthique", s:"ethique", n:5},
  eth_vp:      {l:"Vice-président du Comité", s:"ethique", n:3},
  eth_phil_chef:{l:"Philosophe en chef", s:"ethique", n:3},
  eth_phil:    {l:"Philosophe-conseiller", s:"ethique", n:2},
  eth_rapp:    {l:"Rapporteur éthique", s:"ethique", n:2},
  eth_greffier:{l:"Greffier du Comité", s:"ethique", n:1},
  eth_archi:   {l:"Archiviste", s:"ethique", n:1}
};
var GSERV = {direction:"Direction", justice:"Département de Justice", ethique:"Comité d'Éthique"};
var ITER = 100000;
function $(s){return document.querySelector(s)}
function unhex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function hex(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
async function derive(pw,salt){
  var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:unhex(salt),iterations:ITER},k,256));
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var SESSION=null, tries=0, lockUntil=0;
function save(){try{sessionStorage.setItem("pc_session",JSON.stringify(SESSION))}catch(e){}}

$("#lf").addEventListener("submit",async function(e){
  e.preventDefault();
  var err=$("#err"), now=Date.now();
  if(now<lockUntil){err.textContent="Trop d'essais. Patientez "+Math.ceil((lockUntil-now)/1000)+" s.";return}
  var id=$("#u").value.trim().toUpperCase(), pw=$("#p").value;
  var a=(window.PC_COMPTES||{})[id];
  var ok=false;
  if(a){ok=(await derive(pw,a.salt))===a.hash}
  else{await derive(pw,"00000000000000000000000000000000")}
  if(!ok){
    tries++; $("#p").value="";
    if(tries>=5){tries=0;lockUntil=Date.now()+15000;err.textContent="Trop d'essais. Patientez 15 s."}
    else err.textContent="Compte ou mot de passe incorrect.";
    return;
  }
  tries=0;err.textContent="";
  var sp=await PCNET.suspensions();
  if(a.actif===false||sp[id]!==undefined){err.textContent="Compte suspendu."+(sp[id]?" Motif : "+sp[id]:"")+" Contactez la Direction.";$("#p").value="";return}
  var g=GRADES[a.grade]||{l:"",n:1};
  SESSION={id:id,nom:a.nom,grade:a.grade||"",gradeLabel:g.l,niveau:g.n,apps:a.apps||[]};save();
  $("#p").value="";
  openDesk();
});

/* ===== Bureau ===== */
var wins={}, zTop=10, seq=0, FS=null;
var SYSORDER=["msg","net","docs","notes","trash","calc","set","comptes"];
function ctx(){return {session:SESSION,APPS:APPS,openApp:openApp,openSys:openSys,applyWall:applyWall}}
function applyWall(k){var W=window.SYS_WALLS||{};if(W[k])$("#desk").style.background=W[k][1]}
function trashIcon(){var b=document.querySelector('.ico[data-sys=trash] img');if(b&&SYS.trash)b.src=SYS.trash.dyn()}
function openSys(id,arg){
  var Y=SYS[id];if(!Y)return;
  var key=id==="notes"?"notes:"+(arg||"new"+(++seq)):id;
  var w=mkWin(key,Y.nom,Y.icone);if(!w)return;
  var p=document.createElement("div");p.style.cssText="display:flex;flex-direction:column;flex:1;min-height:0";w.appendChild(p);
  Y.open(p,arg,ctx());
  if(matchMedia("(max-width:720px)").matches||id==="net")w.classList.add("max");
}
function openDesk(){
  $("#lock").hidden=true;$("#desk").hidden=false;
  FS=window.SYS_FS;FS.load(SESSION.id);
  try{var st=JSON.parse(localStorage.getItem("pcset:"+SESSION.id)||"{}");applyWall(st.fond||"violet")}catch(e){applyWall("violet")}
  $("#who").textContent=SESSION.nom+" · "+SESSION.gradeLabel;
  $("#wallname").textContent=SESSION.nom;
  var box=$("#icons");box.innerHTML="";
  SESSION.apps.forEach(function(id){
    var A=APPS[id];if(!A)return;
    var b=document.createElement("button");b.className="ico";b.dataset.app=id;
    b.innerHTML='<img class="pic" src="'+esc(A.icone)+'" alt=""><span>'+esc(A.nom)+'</span>';
    b.addEventListener("dblclick",function(){openApp(id)});
    b.addEventListener("click",function(){if(matchMedia("(max-width:720px), (pointer:coarse)").matches)openApp(id)});
    b.addEventListener("keydown",function(e){if(e.key==="Enter")openApp(id)});
    box.appendChild(b);
  });
  SYSORDER.forEach(function(id){
    var Y=SYS[id];if(!Y||(Y.visible&&!Y.visible(SESSION)))return;
    var b=document.createElement("button");b.className="ico";b.dataset.sys=id;
    b.innerHTML='<img class="pic" src="'+esc(Y.dyn?Y.dyn():Y.icone)+'" alt=""><span>'+esc(Y.nom)+'</span>';
    b.addEventListener("dblclick",function(){openSys(id)});
    b.addEventListener("click",function(){if(matchMedia("(max-width:720px), (pointer:coarse)").matches)openSys(id)});
    b.addEventListener("keydown",function(e){if(e.key==="Enter")openSys(id)});
    box.appendChild(b);
  });
  $("#wallacc").innerHTML=accBadges(SESSION.apps);
  buildMenu();
  if(SESSION.apps.length===1)openApp(SESSION.apps[0]);
}
var ACC={justice:"ACCÈS JUSTICE",ethique:"ACCÈS ÉTHIQUE"};
function accBadges(a){return Object.keys(ACC).map(function(k){var on=a.indexOf(k)>=0;return '<span class="bdg'+(on?' on':'')+'">'+ACC[k]+'</span>'}).join("")}
function buildMenu(){
  var m=$("#menu");
  var h='<div class="hd"><b>'+esc(SESSION.nom)+'</b><span class="micro">'+esc(SESSION.gradeLabel)+' · '+esc(SESSION.id)+'</span><div class="acc">'+accBadges(SESSION.apps)+'</div></div>';
  SESSION.apps.forEach(function(id){var A=APPS[id];if(A)h+='<button data-app="'+id+'"><img src="'+esc(A.icone)+'" alt="">'+esc(A.nom)+' · '+esc(A.hq)+'</button>'});
  h+='<div class="micro" style="padding:.5rem .8rem .2rem">Système</div>';
  SYSORDER.forEach(function(id){var Y=SYS[id];if(Y&&(!Y.visible||Y.visible(SESSION)))h+='<button data-sys="'+id+'"><img src="'+esc(Y.icone)+'" alt="">'+esc(Y.nom)+'</button>'});
  h+='<button data-act="out">⏻ Fermer la session</button>';
  m.innerHTML=h;
  m.querySelectorAll("button[data-app]").forEach(function(b){b.onclick=function(){m.hidden=true;openApp(b.dataset.app)}});
  m.querySelectorAll("button[data-sys]").forEach(function(b){b.onclick=function(){m.hidden=true;openSys(b.dataset.sys)}});
  m.querySelector("[data-act=out]").onclick=function(){logout()};
}
$("#start").onclick=function(e){e.stopPropagation();$("#menu").hidden=!$("#menu").hidden};
document.addEventListener("click",function(e){if(!e.target.closest("#menu"))$("#menu").hidden=true});

function mkWin(key,title,icon){
  if(wins[key]){focusWin(key);return null}
  var w=document.createElement("div");w.className="win";
  var W=innerWidth,H=innerHeight-48;
  var n=Object.keys(wins).length;
  var ww=Math.min(W*.8,1200),hh=Math.min(H*.8,760);
  w.style.width=ww+"px";w.style.height=hh+"px";
  w.style.left=Math.max(0,(W-ww)/2+n*26)+"px";w.style.top=Math.max(0,(H-hh)/2+n*26)+"px";
  w.innerHTML='<div class="tbar">'+(icon?'<img src="'+esc(icon)+'" alt="">':'<span class="gi">⚙</span>')+'<span class="t">'+esc(title)+'</span><button class="mn" title="Réduire">–</button><button class="mx" title="Agrandir">▢</button><button class="x" title="Fermer">✕</button></div><div class="grip"></div>';
  $("#desk").appendChild(w);
  var tb=w.querySelector(".tbar");
  w.addEventListener("pointerdown",function(){focusWin(key)});
  w.querySelector(".mn").onclick=function(){w.classList.add("min");refreshTasks()};
  w.querySelector(".mx").onclick=function(){w.classList.toggle("max")};
  w.querySelector(".x").onclick=function(){w.remove();delete wins[key];refreshTasks()};
  tb.addEventListener("dblclick",function(e){if(!e.target.closest("button"))w.classList.toggle("max")});
  drag(w,tb);resize(w,w.querySelector(".grip"));
  wins[key]={el:w,title:title,icon:icon};
  focusWin(key);
  return w;
}
function openApp(id){
  var A=APPS[id];if(!A)return;
  var w=mkWin(id,A.dept+" — "+A.hq,A.icone);if(!w)return;
  var f=document.createElement("iframe");f.src=A.url;f.title=A.dept;
  f.setAttribute("allow","fullscreen");
  w.appendChild(f);
  w.classList.add("max");
}
function focusWin(key){
  var o=wins[key];if(!o)return;
  o.el.classList.remove("min");o.el.style.zIndex=++zTop;
  Object.keys(wins).forEach(function(k){wins[k].on=(k===key)});
  refreshTasks();
}
function refreshTasks(){
  var t=$("#tasks");t.innerHTML="";
  Object.keys(wins).forEach(function(k){
    var o=wins[k],b=document.createElement("button");
    b.className="task"+(o.on&&!o.el.classList.contains("min")?" on":"");
    b.innerHTML=(o.icon?'<img src="'+esc(o.icon)+'" alt="">':'⚙ ')+esc(o.title.split(" — ")[0]);
    b.onclick=function(){
      if(o.on&&!o.el.classList.contains("min")){o.el.classList.add("min");o.on=false;refreshTasks()}
      else focusWin(k);
    };
    t.appendChild(b);
  });
}
function drag(w,h){
  h.addEventListener("pointerdown",function(e){
    if(e.target.closest("button")||w.classList.contains("max"))return;
    var sx=e.clientX,sy=e.clientY,ox=w.offsetLeft,oy=w.offsetTop;
    w.classList.add("drag");h.setPointerCapture(e.pointerId);
    function mv(ev){w.style.left=(ox+ev.clientX-sx)+"px";w.style.top=Math.max(0,oy+ev.clientY-sy)+"px"}
    function up(){w.classList.remove("drag");h.removeEventListener("pointermove",mv);h.removeEventListener("pointerup",up)}
    h.addEventListener("pointermove",mv);h.addEventListener("pointerup",up);
  });
}
function resize(w,g){
  g.addEventListener("pointerdown",function(e){
    var sx=e.clientX,sy=e.clientY,ow=w.offsetWidth,oh=w.offsetHeight;
    w.classList.add("rsz");g.setPointerCapture(e.pointerId);e.stopPropagation();
    function mv(ev){w.style.width=Math.max(320,ow+ev.clientX-sx)+"px";w.style.height=Math.max(200,oh+ev.clientY-sy)+"px"}
    function up(){w.classList.remove("rsz");g.removeEventListener("pointermove",mv);g.removeEventListener("pointerup",up)}
    g.addEventListener("pointermove",mv);g.addEventListener("pointerup",up);
  });
}

var LOGOUTMSG="";
function logout(msg){
  if(typeof msg!=="string")msg="";
  Object.keys(wins).forEach(function(k){wins[k].el.remove()});wins={};
  SESSION=null;try{sessionStorage.removeItem("pc_session")}catch(e){}
  $("#desk").hidden=true;$("#lock").hidden=false;$("#tasks").innerHTML="";$("#menu").hidden=true;$("#u").value="";$("#u").focus();$("#err").textContent=msg;
}
$("#out").onclick=function(){logout()};
$("#fs").onclick=function(){
  if(document.fullscreenElement){document.exitFullscreen()}
  else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(function(){})}
};
if(!document.documentElement.requestFullscreen)$("#fs").hidden=true;
document.addEventListener("fullscreenchange",function(){$("#fs").textContent=document.fullscreenElement?"Quitter plein écran":"Plein écran"});
window.addEventListener("message",function(e){
  var d=e.data;if(!d||d.pc!=="close"||!wins[d.app])return;
  wins[d.app].el.remove();delete wins[d.app];refreshTasks();
});
document.addEventListener("fschange",trashIcon);
/* suspension : vérifiée toutes les 20 s pendant la session */
function checkSusp(){
  if(!SESSION)return;
  PCNET.suspensions().then(function(sp){
    var a=(window.PC_COMPTES||{})[SESSION.id];
    if(SESSION&&(sp[SESSION.id]!==undefined||(a&&a.actif===false)))logout("Votre compte a été suspendu."+(sp[SESSION.id]?" Motif : "+sp[SESSION.id]:""));
  });
}
setInterval(checkSusp,20000);
/* interface pour les applications des départements (iframes du même site) */
window.PCAPI={
  suspended:function(id){var a=(window.PC_COMPTES||{})[id];return (a&&a.actif===false)||PCNET.cache[id]!==undefined},
  suspendre:function(id,raison){return PCNET.suspend(id,raison||"",SESSION?SESSION.id:"").then(function(){document.dispatchEvent(new CustomEvent("pcsusp"))})},
  reactiver:function(id){return PCNET.unsuspend(id).then(function(){document.dispatchEvent(new CustomEvent("pcsusp"))})},
  refresh:function(){return PCNET.suspensions()}
};
function tick(){var d=new Date();$("#clk").textContent=d.toLocaleDateString("fr-FR")+"  "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
tick();setInterval(tick,15000);
try{sessionStorage.removeItem("pc_session")}catch(e){}
</script>

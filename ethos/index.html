<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comité d'Éthique — HQ Ethos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
:root{
  --forest:#262d20;--forest2:#2f3829;--moss:#343d2e;--olive:#59563a;--rule:#454f3c;
  --copper:#d6a36f;--copper2:#e5cca7;--copper-d:#a8763f;
  --paper:#ece4d2;--paper2:#e0d6bf;--paper-rule:#c6b996;--ink:#1f261b;--ink2:#575e4a;
  --ok:#4c7a45;--warn:#a1701a;--bad:#9c3b2f;
  --f-d:'Cormorant Garamond',Georgia,serif;--f-s:'Source Serif 4',Georgia,serif;--f-m:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--forest);color:var(--copper2);font-family:var(--f-s);font-size:16px;line-height:1.55;
  padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
.micro{font-family:var(--f-m);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase}
.disp{font-family:var(--f-d);text-transform:uppercase;letter-spacing:.05em}

/* ---- accès refusé ---- */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center}
#gate img{width:9rem;margin:0 auto 1.2rem;display:block}
#gate a{color:var(--copper)}

/* ---- démarrage ---- */
#boot{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;padding:2rem;text-align:center;
  background:radial-gradient(80% 70% at 50% 40%,#3a4532 0,var(--forest) 70%);cursor:pointer}
#boot img{width:min(13rem,50vw);filter:drop-shadow(0 10px 30px #0008);animation:rise 1.2s ease both}
#bootmsg{font-family:var(--f-m);font-size:clamp(.8rem,1.6vw,1.05rem);letter-spacing:.06em;max-width:46rem;min-height:4.5rem;color:var(--copper2)}
#bootmsg b{color:var(--copper);font-weight:500}
#boot .skip{position:absolute;bottom:1.4rem}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.caret{display:inline-block;width:.55ch;height:1em;background:var(--copper);vertical-align:-.12em;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

/* ---- ossature ---- */
.shell{display:grid;grid-template-columns:18rem 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--forest2),var(--forest));border-right:1px solid var(--rule);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding:1.4rem 1.3rem 1.1rem;border-bottom:1px solid var(--rule);text-align:center}
.brand img{width:7.2rem;display:block;margin:0 auto .7rem}
.brand b{display:block;font-family:var(--f-d);font-size:1.55rem;letter-spacing:.06em;text-transform:uppercase;line-height:1;color:var(--copper2)}
.brand span{display:block;margin-top:.45rem;color:var(--copper)}
nav{padding:.8rem 0;flex:1}
nav button{display:flex;align-items:baseline;gap:.8rem;width:100%;padding:.7rem 1.3rem;background:none;border:0;border-left:3px solid transparent;cursor:pointer;text-align:left;
  font-family:var(--f-m);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:#b9ad8e}
nav button i{font-style:normal;color:var(--olive);min-width:1.5rem}
nav button:hover{background:#ffffff0a;color:var(--copper2)}
nav button.on{background:#ffffff10;border-left-color:var(--copper);color:var(--copper)}
nav button.on i{color:var(--copper)}
.me{padding:1rem 1.3rem;border-top:1px solid var(--rule)}
.me b{display:block;font-family:var(--f-d);font-size:1.25rem;line-height:1.1}
.me span{color:var(--copper)}
.lv{display:flex;gap:3px;margin-top:.6rem}
.lv s{width:1.1rem;height:.3rem;background:var(--rule);text-decoration:none}
.lv s.on{background:var(--copper)}

main{min-width:0;background:
  radial-gradient(90% 40% at 70% 0,#38422f 0,transparent 70%),var(--forest)}
.docbar{display:flex;align-items:center;gap:1rem;padding:1rem clamp(1.4rem,3.5vw,4rem);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.docbar .crumb{color:var(--olive)}
.docbar .crumb b{color:var(--copper);font-weight:500}
.docbar .ro{margin-left:auto;color:#b9ad8e}
.sheet{padding:clamp(1.4rem,3.5vw,4rem);max-width:96rem}
.paper{background:var(--paper);color:var(--ink);border-top:4px solid var(--copper);box-shadow:0 18px 50px #0006;padding:clamp(1.2rem,3vw,2.6rem)}
.paper h2{font-family:var(--f-d);font-size:clamp(2rem,4vw,3.2rem);text-transform:uppercase;letter-spacing:.03em;line-height:1}
.paper .lead{color:var(--ink2);max-width:46rem;margin-top:.6rem}
.paper hr{border:0;border-top:1px solid var(--paper-rule);margin:1.5rem 0}

/* accueil */
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:2rem;align-items:center}
.hero h1{font-family:var(--f-d);font-weight:700;text-transform:uppercase;font-size:clamp(2.4rem,6.2vw,5.4rem);line-height:.92;color:var(--ink);overflow-wrap:break-word}
.hero h1 em{display:block;font-style:italic;color:var(--copper-d);text-transform:none;font-size:.55em;margin-top:.3rem}
.devise{font-family:var(--f-d);font-style:italic;font-size:clamp(1.3rem,2.4vw,1.9rem);border-left:3px solid var(--copper);padding-left:1.1rem;margin-top:1.5rem;color:var(--ink)}
.hero img{width:min(100%,17rem);justify-self:center;filter:drop-shadow(0 12px 22px #0004)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:1px;background:var(--paper-rule);border:1px solid var(--paper-rule);margin-top:1.8rem}
.stat{background:var(--paper);padding:1rem 1.2rem}
.stat b{display:block;font-family:var(--f-d);font-size:2.8rem;line-height:1}
.stat .micro{color:var(--ink2)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin-top:1.6rem}
.box{border:1px solid var(--paper-rule);padding:1.1rem 1.3rem;min-width:0}
.box h3{font-family:var(--f-d);font-size:1.4rem;text-transform:uppercase;margin-bottom:.5rem}
.box li{margin:.35rem 0}
.box ul{margin:0;padding-left:1.1rem}
/* piliers */
.pil{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1.2rem;margin-top:1.4rem}
.pil div{border:1px solid var(--paper-rule);border-top:3px solid var(--copper);padding:1.3rem;background:#ffffff40}
.pil .n{font-family:var(--f-m);font-size:.74rem;letter-spacing:.2em;color:var(--copper-d)}
.pil h3{font-family:var(--f-d);font-size:2rem;text-transform:uppercase;margin:.2rem 0 .5rem}
.pil p{color:var(--ink2)}
.art{margin-top:1.6rem;display:grid;gap:.9rem}
.art li{margin:0}
.art ol{margin:0;padding:0;list-style:none;counter-reset:a;display:grid;gap:.8rem}
.art ol li{counter-increment:a;padding-left:3.6rem;position:relative}
.art ol li::before{content:"Art. " counter(a);position:absolute;left:0;top:.15rem;font-family:var(--f-m);font-size:.7rem;letter-spacing:.1em;color:var(--copper-d);text-transform:uppercase}

/* registres */
.bar{display:flex;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:1.3rem}
.btn{background:var(--ink);color:var(--copper2);border:0;border-bottom:2px solid var(--copper);padding:.6rem 1.1rem;font-family:var(--f-m);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.btn:hover{background:#2f3a28}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--paper-rule)}
.btn.sm{padding:.3rem .65rem;font-size:.64rem}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1rem;background:#ffffff55;border:1px solid var(--paper-rule);padding:1.2rem;margin-bottom:1.4rem}
form.f .full{grid-column:1/-1}
form.f label{display:block;font-family:var(--f-m);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:.25rem}
form.f input,form.f select,form.f textarea{width:100%;background:#fffdf6;color:var(--ink);border:1px solid var(--paper-rule);padding:.55rem .7rem;border-radius:0}
form.f textarea{min-height:7rem;resize:vertical}
.list{display:grid;gap:.9rem}
.row{border:1px solid var(--paper-rule);border-left:4px solid var(--copper);background:#ffffff40;padding:1rem 1.2rem;min-width:0}
.row.lock{border-left-color:var(--olive);background:#0000000d}
.row .hd{display:flex;gap:.8rem;flex-wrap:wrap;align-items:baseline}
.row h3{font-family:var(--f-d);font-size:1.55rem;line-height:1.1}
.row .ref{font-family:var(--f-m);font-size:.7rem;letter-spacing:.1em;color:var(--ink2)}
.row .meta{color:var(--ink2);font-size:.9rem;margin-top:.2rem}
.row p.tx{white-space:pre-wrap;overflow-wrap:anywhere;margin:.55rem 0}
.row .ft{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;color:var(--ink2);font-size:.85rem;margin-top:.4rem}
.tag{font-family:var(--f-m);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;padding:.12rem .5rem;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.neutral{color:var(--ink2)}
.empty{padding:2.4rem;border:1px dashed var(--paper-rule);color:var(--ink2);text-align:center}

/* hiérarchie */
.org{display:grid;gap:1.3rem;margin-top:1.4rem}
.rk{border:1px solid var(--paper-rule);background:#ffffff35}
.rk>h3{background:var(--moss);color:var(--copper2);padding:.7rem 1.2rem;font-family:var(--f-d);font-size:1.5rem;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:.8rem;align-items:baseline;flex-wrap:wrap}
.rk>h3 small{font-family:var(--f-m);font-size:.64rem;letter-spacing:.16em;color:var(--copper)}
.gr{padding:.4rem 0;position:relative}
.gr::before{content:"";position:absolute;left:1.55rem;top:.9rem;bottom:.9rem;width:1px;background:var(--paper-rule)}
.g{display:grid;grid-template-columns:auto 1fr;gap:.2rem 1rem;padding:.8rem 1.2rem .8rem 1.2rem}
.g .dm{width:.7rem;height:.7rem;background:var(--copper);transform:rotate(45deg);margin:.5rem .45rem 0 .1rem;position:relative}
.g b{font-family:var(--f-d);font-size:1.4rem;line-height:1.1}
.g .d{color:var(--ink2);font-size:.92rem}
.g .pp{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.chip{font-family:var(--f-m);font-size:.7rem;letter-spacing:.06em;padding:.2rem .55rem;background:var(--moss);color:var(--copper2)}
.chip.vac{background:none;border:1px dashed var(--paper-rule);color:var(--ink2)}
.lvp{display:inline-flex;gap:2px;margin-left:.4rem;vertical-align:middle}
.lvp s{width:.7rem;height:.22rem;background:var(--paper-rule);text-decoration:none}
.lvp s.on{background:var(--copper-d)}
.mx{overflow-x:auto;margin-top:1rem;border:1px solid var(--paper-rule)}
.mx table{border-collapse:collapse;width:100%;min-width:42rem;font-size:.85rem}
.mx th,.mx td{padding:.45rem .7rem;border-bottom:1px solid var(--paper-rule);text-align:center}
.mx th:first-child,.mx td:first-child{text-align:left;font-family:var(--f-d);font-size:1.05rem;white-space:nowrap}
.mx th{font-family:var(--f-m);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);background:#0000000a}
.mx td.me2{background:#d6a36f33}
.mx .r{color:var(--ink2)}.mx .w{color:var(--ok);font-weight:600}.mx .x{color:var(--bad);font-weight:600}.mx .n{color:#00000033}

@media (max-width:920px){
  .shell{grid-template-columns:1fr}
  aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule)}
  .brand{display:flex;align-items:center;gap:1rem;text-align:left;padding:.8rem 1rem}
  .brand img{width:3.4rem;margin:0}
  nav{display:flex;overflow-x:auto;padding:0}
  nav button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:.7rem .9rem}
  nav button.on{border-bottom-color:var(--copper)}
  .me{display:none}
  .hero{grid-template-columns:1fr}.hero img{order:-1;width:9rem}
  .cols{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="gate" hidden>
  <div>
    <img src="logo.png" alt="Comité d'Éthique">
    <h1 class="disp" style="font-size:2.4rem;color:var(--copper2)">Accès réservé</h1>
    <p style="margin:.6rem 0 1.2rem;color:#b9ad8e">Ce site est une application du poste de la Fondation.<br>Ouvrez une session avec un compte ayant l'ACCÈS ÉTHIQUE.</p>
    <p><a href="../index.html" target="_top">Aller au poste de travail</a></p>
  </div>
</div>

<div id="boot" hidden>
  <img src="logo.png" alt="">
  <div id="bootmsg"></div>
  <span class="micro skip" style="color:var(--olive)">Cliquez pour passer</span>
</div>

<div class="shell" id="app" hidden>
  <aside>
    <div class="brand"><img src="logo.png" alt=""><div><b>Comité d'Éthique</b><span class="micro">HQ Ethos · Installation - 73</span></div></div>
    <nav id="nav"></nav>
    <div class="me"><span class="micro">Session</span><b id="meName"></b><span class="micro" id="meGrade"></span><div class="lv" id="meLv"></div></div>
  </aside>
  <main>
    <div class="docbar micro"><span class="crumb">ETHOS / <b id="crumb"></b></span><span class="ro" id="ro"></span></div>
    <div class="sheet"><div class="paper" id="view"></div></div>
  </main>
</div>

<script>
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

var SES=null;
try{SES=JSON.parse(sessionStorage.getItem("pc_session")||"null")}catch(e){}
if(!SES||!SES.apps||SES.apps.indexOf("ethique")<0){$("#gate").hidden=false}
else{setTimeout(start,0)}

/* ===== Grades du Comité ===== */
var ETH_GRADES={
  eth_pres:{l:"Président du Comité d'Éthique",n:4,d:"Garant de la Moral Law. Valide les avis, tranche les saisines et représente le Comité."},
  eth_vp:{l:"Vice-président du Comité",n:3,d:"Supplée le Président et supervise l'ensemble des registres."},
  eth_phil_chef:{l:"Philosophe en chef",n:3,d:"Rédige la doctrine du Comité et dirige le Conseil des Philosophes."},
  eth_phil:{l:"Philosophe-conseiller",n:2,d:"Examine les saisines et éclaire les avis par l'analyse philosophique."},
  eth_rapp:{l:"Rapporteur éthique",n:2,d:"Instruit les saisines, mène les audits et présente les avis."},
  eth_greffier:{l:"Greffier du Comité",n:1,d:"Tient le registre, enregistre les saisines et met en forme les actes."},
  eth_archi:{l:"Archiviste",n:1,d:"Conserve les avis, les audits et les dossiers du Comité."}
};
var RANKS=[
  {t:"Direction du Comité",s:"Niveaux 3 – 4",g:["eth_pres","eth_vp"]},
  {t:"Conseil des Philosophes",s:"Niveaux 2 – 3",g:["eth_phil_chef","eth_phil","eth_rapp"]},
  {t:"Greffe éthique",s:"Niveau 1",g:["eth_greffier","eth_archi"]}
];
/* Classes des dossiers sensibles : niveau minimum pour lire. La Classe A est la plus confidentielle. */
var CLASSES={A:{label:"Classe A",min:4},B:{label:"Classe B",min:2},C:{label:"Classe C",min:1}};

var DIRC=["direction"], COMITE=Object.keys(ETH_GRADES);
var ALLW=DIRC.concat(["eth_pres","eth_vp","eth_phil_chef","eth_phil","eth_rapp"]);
/* Sections : lecture pour tous les comptes ayant l'ACCÈS ÉTHIQUE ; w = qui peut écrire ; d = qui peut supprimer */
var SEC={
  avis:{label:"Avis éthiques",pref:"AVIS",num:"03",lead:"Avis rendus par le Comité sur les actes, projets et décisions des départements.",
    st:{"Favorable":"ok","Réservé":"warn","Défavorable":"bad"},stLabel:"Sens de l'avis",
    f:[["objet","Objet de l'avis",1],["service","Département concerné"],["texte","Motivation de l'avis","area"]],
    w:ALLW,d:DIRC.concat(["eth_pres","eth_vp"])},
  saisines:{label:"Saisines",pref:"SAI",num:"04",lead:"Demandes adressées au Comité : un département, un agent ou la Direction soumet un cas à l'examen éthique.",
    st:{"Reçue":"neutral","En examen":"warn","Close":"ok"},stLabel:"Statut",
    f:[["objet","Objet de la saisine",1],["service","Département demandeur"],["urgence","Urgence","sel",["Normale","Haute","Critique"]],["texte","Exposé des faits","area"]],
    w:"*",d:DIRC.concat(["eth_pres","eth_vp"])},
  audits:{label:"Audits & évaluations",pref:"AUD",num:"05",lead:"Contrôles éthiques menés dans les départements de l'Installation - 73.",
    st:{"Planifié":"neutral","En cours":"warn","Rendu":"ok"},stLabel:"Étape",
    f:[["objet","Département audité",1],["periode","Période concernée"],["texte","Constats et recommandations","area"]],
    w:DIRC.concat(["eth_pres","eth_vp","eth_phil_chef","eth_rapp"]),d:DIRC.concat(["eth_pres","eth_vp"])},
  dossiers:{label:"Dossiers sensibles",pref:"DOS",num:"06",lead:"Cas de conscience et affaires confidentielles. L'accès dépend de la classe du dossier et de votre niveau d'habilitation.",
    st:{"Ouvert":"warn","Sous scellé":"bad","Clos":"ok"},stLabel:"Statut",classed:true,
    f:[["objet","Intitulé du dossier",1],["classe","Classe","cls"],["texte","Contenu","area"]],
    w:DIRC.concat(["eth_pres","eth_vp","eth_phil_chef"]),d:DIRC.concat(["eth_pres"])}
};
var TABS=[["accueil","Accueil","01"],["charte","Charte","02"],["avis"],["saisines"],["audits"],["dossiers"],["hierarchie","Hiérarchie","07"]];

function start(){
  var G=SES.grade||"", LV=SES.niveau||1;
  if(COMITE.indexOf(G)<0&&G!=="direction")LV=1;           /* invité d'un autre département */
  if(G==="direction")LV=5;
  function can(list){return list==="*"||list.indexOf(G)>=0}
  function canClass(c){return LV>=CLASSES[c].min}

  var DB={avis:[],saisines:[],audits:[],dossiers:[]};
  try{var r=JSON.parse(localStorage.getItem("ethos_v2")||"null");
    if(r)DB=Object.assign(DB,r);
    else{var o=JSON.parse(localStorage.getItem("ethos_v1")||"null");if(o){DB.avis=o.avis||[];DB.saisines=o.saisines||[]}}}catch(e){}
  function persist(){try{localStorage.setItem("ethos_v2",JSON.stringify(DB))}catch(e){}}

  /* membres réels (comptes du poste) pour la hiérarchie */
  function membres(g){
    try{var C=parent.PC_COMPTES||{};return Object.keys(C).filter(function(k){return C[k].grade===g&&C[k].actif!==false}).map(function(k){return {id:k,nom:C[k].nom}})}catch(e){return []}
  }

  /* panneau latéral */
  $("#meName").textContent=SES.nom;
  $("#meGrade").textContent=(SES.gradeLabel||"Accès Éthique")+" · "+SES.id;
  $("#meLv").innerHTML=[1,2,3,4,5].map(function(i){return '<s class="'+(i<=LV?"on":"")+'"></s>'}).join("");
  var nav=$("#nav"),cur="accueil",open=false;
  TABS.forEach(function(t){
    var b=document.createElement("button"),lab=t[1]||SEC[t[0]].label,num=t[2]||SEC[t[0]].num;
    b.innerHTML='<i>'+num+'</i>'+esc(lab);b.dataset.t=t[0];
    b.onclick=function(){cur=t[0];open=false;draw()};nav.appendChild(b);
  });

  function draw(){
    nav.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.t===cur)});
    var t=TABS.filter(function(x){return x[0]===cur})[0];
    $("#crumb").textContent=(t[1]||SEC[cur].label).toUpperCase();
    var ro="";
    if(SEC[cur]&&!can(SEC[cur].w))ro="Lecture seule pour votre grade";
    $("#ro").textContent=ro;
    var v=$("#view");
    v.innerHTML=cur==="accueil"?accueil():cur==="charte"?charte():cur==="hierarchie"?hierarchie():registre(cur);
    bind();
    window.scrollTo(0,0);
  }

  /* ---- pages ---- */
  function allEntries(){
    var out=[];Object.keys(SEC).forEach(function(k){DB[k].forEach(function(e){
      if(SEC[k].classed&&!canClass(e.classe||"C"))return;out.push(Object.assign({sec:k},e))})});
    return out.sort(function(a,b){return b.ts-a.ts});
  }
  function accueil(){
    var last=allEntries().slice(0,5);
    var h='<div class="hero"><div><p class="micro" style="color:var(--ink2);margin-bottom:1rem">Headquarter « Ethos » · Installation - 73</p>'+
      '<h1>Comité d\'Éthique<em>Headquarter Ethos</em></h1>'+
      '<p class="devise">Philosophie. Moral Law. Ethics.</p></div>'+
      '<img src="logo.png" alt="Sceau du Comité d\'Éthique"></div>'+
      '<div class="stats">'+
        '<div class="stat"><span class="micro">Avis rendus</span><b>'+DB.avis.length+'</b></div>'+
        '<div class="stat"><span class="micro">Saisines en cours</span><b>'+DB.saisines.filter(function(s){return s.statut!=="Close"}).length+'</b></div>'+
        '<div class="stat"><span class="micro">Audits</span><b>'+DB.audits.length+'</b></div>'+
        '<div class="stat"><span class="micro">Dossiers visibles</span><b>'+DB.dossiers.filter(function(d){return canClass(d.classe||"C")}).length+'</b></div></div>'+
      '<div class="cols"><div class="box"><h3>Activité récente</h3>'+
        (last.length?'<ul>'+last.map(function(e){return '<li><span class="ref micro" style="color:var(--ink2)">'+esc(e.ref)+'</span> — '+esc(e.objet)+'</li>'}).join("")+'</ul>':'<p style="color:var(--ink2)">Aucune activité pour le moment.</p>')+'</div>'+
        '<div class="box"><h3>Vos accès</h3><ul>'+
          Object.keys(SEC).map(function(k){var w=can(SEC[k].w);return '<li>'+SEC[k].label+' : <b>'+(w?"lecture et écriture":"lecture seule")+'</b></li>'}).join("")+
          '</ul><p class="micro" style="margin-top:.7rem;color:var(--ink2)">Habilitation niveau '+LV+' — dossiers jusqu\'à la '+(LV>=4?"Classe A":LV>=2?"Classe B":"Classe C")+'</p></div></div>';
    return h;
  }
  function charte(){
    var P=[["I","Philosophie","Le Comité interroge le sens et la finalité des actes de la Fondation avant de juger de leur efficacité. Toute décision doit pouvoir s'expliquer par des raisons, et pas seulement par la nécessité."],
           ["II","Moral Law","Certaines limites ne se négocient pas. La loi morale prime sur l'opportunité : aucun objectif de confinement, de recherche ou de sécurité ne justifie de les franchir."],
           ["III","Ethics","L'éthique est une pratique : avis motivés, saisines instruites, réserves consignées. Le Comité conseille, alerte et rend compte en toute indépendance."]];
    var A=["Le Comité d'Éthique est saisi par tout département, tout agent habilité ou la Direction de l'Installation - 73.",
           "Toute saisine fait l'objet d'un accusé d'enregistrement et d'un examen motivé.",
           "Un avis peut être favorable, réservé ou défavorable. Il est toujours motivé par écrit.",
           "Les dossiers sensibles sont classés A, B ou C. L'accès suit le niveau d'habilitation.",
           "Le Comité ne détient aucun pouvoir d'exécution : il éclaire, il alerte, il consigne."];
    return '<h2>Charte du Comité</h2><p class="lead">Texte provisoire, à remplacer par la charte officielle.</p>'+
      '<div class="pil">'+P.map(function(p){return '<div><span class="n">'+p[0]+'</span><h3>'+p[1]+'</h3><p>'+p[2]+'</p></div>'}).join("")+'</div>'+
      '<hr><h2 style="font-size:2rem">Fonctionnement</h2><div class="art"><ol>'+A.map(function(a){return '<li>'+a+'</li>'}).join("")+'</ol></div>';
  }
  function pips(n){return '<span class="lvp" title="Niveau '+n+'">'+[1,2,3,4,5].map(function(i){return '<s class="'+(i<=n?"on":"")+'"></s>'}).join("")+'</span>'}
  function hierarchie(){
    var h='<h2>Hiérarchie du Comité</h2><p class="lead">Les grades du Comité, leurs membres et leurs droits. Les grades sont provisoires.</p><div class="org">';
    RANKS.forEach(function(rk){
      h+='<div class="rk"><h3>'+rk.t+'<small>'+rk.s+'</small></h3><div class="gr">';
      rk.g.forEach(function(g){
        var m=membres(g),I=ETH_GRADES[g];
        h+='<div class="g"><span class="dm"></span><div><b>'+I.l+'</b>'+pips(I.n)+'<div class="d">'+I.d+'</div><div class="pp">'+
          (m.length?m.map(function(x){return '<span class="chip">'+esc(x.nom)+' · '+esc(x.id)+'</span>'}).join(""):'<span class="chip vac">Poste vacant</span>')+'</div></div></div>';
      });
      h+='</div></div>';
    });
    h+='</div><h2 style="font-size:2rem;margin-top:2rem">Matrice des accès</h2><p class="lead">L = lecture · É = lecture et écriture · S = écriture et suppression. Ligne en surbrillance : votre grade.</p>';
    h+='<div class="mx"><table><tr><th>Grade</th>'+Object.keys(SEC).map(function(k){return '<th>'+SEC[k].label+'</th>'}).join("")+'<th>Niveau</th></tr>';
    COMITE.forEach(function(g){
      h+='<tr><td class="'+(g===G?"me2":"")+'">'+ETH_GRADES[g].l+'</td>'+Object.keys(SEC).map(function(k){
        var s=SEC[k],w=s.w==="*"||s.w.indexOf(g)>=0,d=s.d.indexOf(g)>=0;
        var c=d?'<span class="x">S</span>':w?'<span class="w">É</span>':'<span class="r">L</span>';
        return '<td class="'+(g===G?"me2":"")+'">'+c+'</td>'}).join("")+'<td class="'+(g===G?"me2":"")+'">'+ETH_GRADES[g].n+'</td></tr>';
    });
    return h+'</table></div>';
  }

  function registre(k){
    var S=SEC[k],L=DB[k],W=can(S.w);
    var h='<div class="bar"><div><h2>'+S.label+'</h2><p class="lead">'+S.lead+'</p></div>'+
      (W?'<button class="btn" id="new" style="margin-left:auto">'+(open?"Fermer":"+ Nouveau")+'</button>':'')+'</div>';
    if(open&&W){
      h+='<form class="f" id="frm">';
      S.f.forEach(function(f){
        var cl=(f[2]==="area")?' class="full"':'';
        h+='<div'+cl+'><label>'+f[1]+'</label>';
        if(f[2]==="area")h+='<textarea name="'+f[0]+'"></textarea>';
        else if(f[2]==="sel")h+='<select name="'+f[0]+'">'+f[3].map(function(o){return '<option>'+o+'</option>'}).join("")+'</select>';
        else if(f[2]==="cls")h+='<select name="classe">'+Object.keys(CLASSES).filter(canClass).map(function(c){return '<option value="'+c+'">'+CLASSES[c].label+'</option>'}).join("")+'</select>';
        else h+='<input name="'+f[0]+'"'+(f[2]===1?' required':'')+'>';
        h+='</div>';
      });
      h+='<div><label>'+S.stLabel+'</label><select name="statut">'+Object.keys(S.st).map(function(s){return '<option>'+s+'</option>'}).join("")+'</select></div>'+
         '<div><label>Rédigé par</label><input name="auteur" value="'+esc(SES.nom)+'"></div>'+
         '<div class="full"><button class="btn" type="submit">Enregistrer</button></div></form>';
    }
    if(!L.length)return h+'<div class="empty">Aucun élément enregistré.</div>';
    h+='<div class="list">'+L.slice().sort(function(a,b){return b.ts-a.ts}).map(function(e){
      var c=e.classe||"C";
      if(S.classed&&!canClass(c))
        return '<div class="row lock"><div class="hd"><span class="ref">'+esc(e.ref)+'</span><h3>'+CLASSES[c].label.toUpperCase()+' — contenu masqué</h3><span class="tag neutral">Habilitation insuffisante</span></div><div class="meta">Niveau '+CLASSES[c].min+' requis pour consulter ce dossier.</div></div>';
      var meta=[];
      S.f.forEach(function(f){if(f[0]!=="objet"&&f[0]!=="texte"&&f[0]!=="classe"&&e[f[0]])meta.push(f[1]+" : "+esc(e[f[0]]))});
      return '<div class="row"><div class="hd"><span class="ref">'+esc(e.ref)+'</span><h3>'+esc(e.objet)+'</h3><span class="tag '+(S.st[e.statut]||"neutral")+'">'+esc(e.statut)+'</span>'+
        (S.classed?'<span class="tag neutral">'+CLASSES[c].label+'</span>':'')+'</div>'+
        (meta.length?'<div class="meta">'+meta.join(" · ")+'</div>':'')+
        (e.texte?'<p class="tx">'+esc(e.texte)+'</p>':'')+
        '<div class="ft"><span>'+esc(e.date)+' · '+esc(e.auteur)+'</span>'+
        (can(S.d)?'<button class="btn ghost sm del" data-id="'+e.id+'" style="margin-left:auto">Supprimer</button>':'')+'</div></div>';
    }).join("")+'</div>';
    return h;
  }
  function bind(){
    var nb=$("#new");if(nb)nb.onclick=function(){open=!open;draw()};
    var f=$("#frm");
    if(f)f.onsubmit=function(e){
      e.preventDefault();var S=SEC[cur],d=new FormData(f),L=DB[cur];
      var n=L.reduce(function(m,x){return Math.max(m,x.n||0)},0)+1,y=new Date().getFullYear();
      var it={id:"i"+Date.now(),n:n,ts:Date.now(),ref:"ETH-"+S.pref+"-"+y+"-"+String(n).padStart(3,"0"),
        statut:d.get("statut"),auteur:(d.get("auteur")||"").trim()||SES.nom,date:new Date().toLocaleDateString("fr-FR")};
      S.f.forEach(function(x){it[x[0]]=(d.get(x[0])||"").trim()});
      L.push(it);persist();open=false;draw();
    };
    document.querySelectorAll(".del").forEach(function(b){b.onclick=function(){
      if(b.dataset.arm){DB[cur]=DB[cur].filter(function(x){return x.id!==b.dataset.id});persist();draw()}
      else{b.dataset.arm=1;b.textContent="Confirmer ?"}
    }});
  }

  /* ---- démarrage ---- */
  async function boot(){
    var B=$("#boot"),msg=$("#bootmsg"),skip=false;
    B.hidden=false;B.onclick=function(){skip=true};
    var parts=[["Connect. . . , "],["Bienvenue ",""],[SES.nom,"b"],[" vous êtes actuellement sur le headquarter « "],["Ethos","b"],[" » délégation de l'Installation - 73. . ."]];
    msg.innerHTML="";
    for(var i=0;i<parts.length&&!skip;i++){
      var sp=document.createElement("span");if(parts[i][1]==="b")sp.style.color="var(--copper)";msg.appendChild(sp);
      var ch=Array.from(parts[i][0]);
      for(var j=0;j<ch.length;j++){if(skip)break;sp.textContent+=ch[j];await sleep(ch[j]==="."?160:26)}
    }
    if(skip){msg.textContent="Connect. . . , Bienvenue "+SES.nom+" vous êtes actuellement sur le headquarter « Ethos » délégation de l'Installation - 73. . ."}
    else await sleep(900);
    B.hidden=true;$("#app").hidden=false;draw();
  }
  boot();
}
</script>
</body>
</html>

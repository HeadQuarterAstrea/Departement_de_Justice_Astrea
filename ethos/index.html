<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comité d'Éthique — ETHOS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--navy:#14213d;--navy2:#0d1730;--gold:#c9a24a;--gold2:#e2c277;--ivory:#f4efe3;--ivory2:#e9e2d0;--ink:#1b2236;--ink2:#566078;--rule:#d3c9ae;--ok:#2f7a57;--warn:#a1701a;--bad:#9c2f2f;
--f-d:'Cormorant Garamond',Georgia,serif;--f-s:'IBM Plex Sans',system-ui,sans-serif;--f-m:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ivory);color:var(--ink);font-family:var(--f-s);font-size:16px;line-height:1.6;padding-left:env(safe-area-inset-left,0);padding-right:env(safe-area-inset-right,0)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-d);font-weight:700;margin:0;text-wrap:balance;line-height:1.05}
.micro{font-family:var(--f-m);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase}
/* accès refusé */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--navy);color:var(--ivory);text-align:center}
#gate a{color:var(--gold2)}
/* en-tête */
header{background:var(--navy);color:var(--ivory);border-bottom:3px solid var(--gold)}
.top{display:flex;align-items:center;gap:1rem;padding:1rem clamp(1rem,3.5vw,4rem);flex-wrap:wrap}
.top img{width:3.4rem;height:3.4rem}
.top .nm b{display:block;font-family:var(--f-d);font-size:1.7rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.top .nm span{color:var(--gold2)}
.top .me{margin-left:auto;text-align:right;color:#c8cddb}
nav{display:flex;gap:.2rem;padding:0 clamp(1rem,3.5vw,4rem);overflow-x:auto;background:var(--navy2)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:.85rem 1.1rem;cursor:pointer;color:#c8cddb;font-family:var(--f-m);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
nav button:hover{color:#fff}
nav button.on{color:var(--gold2);border-bottom-color:var(--gold)}
main{padding:clamp(1.2rem,3.5vw,4rem);max-width:90rem;margin:0 auto}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:2.5rem;align-items:center;padding:1rem 0 2.5rem;border-bottom:1px solid var(--rule)}
.hero h1{font-size:clamp(2.6rem,7vw,6rem);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:break-word}
.hero h1 em{display:block;font-style:italic;color:var(--gold);text-transform:none;font-size:.6em;margin-top:.3rem}
.quote{font-family:var(--f-d);font-style:italic;font-size:clamp(1.3rem,2.4vw,2rem);border-left:3px solid var(--gold);padding-left:1.2rem;margin-top:1.6rem}
.quote b{display:block;font-style:normal;font-family:var(--f-m);font-size:.8rem;letter-spacing:.2em;color:var(--ink2);margin-top:.6rem;font-weight:500}
.hero .seal{width:min(100%,22rem);justify-self:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin:2rem 0}
.stat{background:var(--ivory);padding:1.2rem 1.3rem}
.stat b{display:block;font-family:var(--f-d);font-size:3rem;line-height:1}
h2.sec{font-size:2rem;margin:2.2rem 0 1rem}
/* piliers */
.pill{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1.2rem}
.pil{background:#fff8;border:1px solid var(--rule);border-top:3px solid var(--gold);padding:1.5rem}
.pil .n{font-family:var(--f-m);color:var(--gold);font-size:.8rem;letter-spacing:.2em}
.pil h3{font-size:1.9rem;text-transform:uppercase;margin:.3rem 0 .6rem}
.pil p{color:var(--ink2)}
/* registre */
.bar{display:flex;gap:1rem;align-items:end;flex-wrap:wrap;margin-bottom:1.2rem}
.bar h2{font-size:2.4rem}
.btn{background:var(--navy);color:var(--ivory);border:0;padding:.65rem 1.2rem;font-family:var(--f-m);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-bottom:2px solid var(--gold)}
.btn:hover{background:#1d2f57}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn.sm{padding:.35rem .7rem;font-size:.66rem}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:1rem;background:#fff9;border:1px solid var(--rule);padding:1.3rem;margin-bottom:1.5rem}
form.f .full{grid-column:1/-1}
form.f label{display:block;font-family:var(--f-m);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:.25rem}
form.f input,form.f select,form.f textarea{width:100%;background:#fff;border:1px solid var(--rule);padding:.6rem .7rem;border-radius:0}
form.f textarea{min-height:7rem;resize:vertical}
.list{display:grid;gap:.9rem}
.row{background:#fff9;border:1px solid var(--rule);border-left:4px solid var(--gold);padding:1.1rem 1.3rem;min-width:0}
.row .hd{display:flex;gap:.8rem;flex-wrap:wrap;align-items:baseline}
.row h3{font-size:1.5rem}
.row .ref{font-family:var(--f-m);font-size:.72rem;color:var(--ink2);letter-spacing:.1em}
.row p{white-space:pre-wrap;overflow-wrap:anywhere;margin:.5rem 0 .7rem}
.tag{font-family:var(--f-m);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;padding:.15rem .5rem;border:1px solid currentColor}
.t-ok{color:var(--ok)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}.t-n{color:var(--ink2)}
.empty{padding:2.5rem;border:1px dashed var(--rule);color:var(--ink2);text-align:center}
.row .ft{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;color:var(--ink2);font-size:.85rem}
/* comité */
.org{display:grid;gap:1.4rem}
.rk{border:1px solid var(--rule);background:#fff9}
.rk>h3{background:var(--navy);color:var(--ivory);padding:.8rem 1.3rem;font-size:1.4rem;text-transform:uppercase;letter-spacing:.06em}
.rk>h3 small{font-family:var(--f-m);font-size:.66rem;letter-spacing:.16em;color:var(--gold2);margin-left:.8rem}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1px;background:var(--rule)}
.gr div{background:var(--ivory);padding:1rem 1.3rem}
.gr b{font-family:var(--f-d);font-size:1.35rem;display:block;line-height:1.1}
.gr span{color:var(--ink2);font-size:.88rem}
footer{padding:2rem clamp(1rem,3.5vw,4rem);color:var(--ink2);border-top:1px solid var(--rule);text-align:center}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero .seal{width:11rem;order:-1}.top .me{margin-left:0;text-align:left;width:100%}}
</style>
</head>
<body>

<div id="gate" hidden><div><h1 style="font-size:2.4rem">Accès réservé</h1><p>Ce site est une application du poste de la Fondation.<br>Ouvrez une session avec un compte du Comité d'Éthique.</p><p><a href="../index.html" target="_top">Aller au poste de travail</a></p></div></div>

<div id="app" hidden>
<header>
  <div class="top">
    <img src="logo.svg" alt="">
    <div class="nm"><b>Comité d'Éthique</b><span class="micro">HQ ETHOS · Délégation Installation - 73</span></div>
    <div class="me micro" id="me"></div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="view"></main>
<footer class="micro">PHILOSOPHIE. MORAL LAW. ETHICS. — Fondation S.C.P.F</footer>
</div>

<script>
var SES=null;
try{SES=JSON.parse(sessionStorage.getItem("pc_session")||"null")}catch(e){}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

if(!SES||SES.apps.indexOf("ethique")<0){$("#gate").hidden=false}
else{$("#app").hidden=false;init()}

function init(){
  $("#me").innerHTML=esc(SES.nom)+'<br><span style="color:var(--gold2)">'+esc(SES.gradeLabel||"Accès Éthique")+' · '+esc(SES.id)+'</span>';
  var G=SES.grade||"";
  var AVIS_W=["direction","eth_pres","eth_vp","eth_phil_chef","eth_phil","eth_rapp"], DEL=["direction","eth_pres","eth_vp"];
  function canW(k){return k==="saisines"||AVIS_W.indexOf(G)>=0}
  function canD(){return DEL.indexOf(G)>=0}
  var DB={avis:[],saisines:[]};
  try{var r=JSON.parse(localStorage.getItem("ethos_v1")||"null");if(r)DB=r}catch(e){}
  function persist(){try{localStorage.setItem("ethos_v1",JSON.stringify(DB))}catch(e){}}

  var TABS=[["accueil","Accueil"],["charte","Charte"],["avis","Avis éthiques"],["saisines","Saisines"],["comite","Comité"]];
  var cur="accueil", open=false;
  var nav=$("#nav");
  TABS.forEach(function(t){var b=document.createElement("button");b.textContent=t[1];b.dataset.t=t[0];b.onclick=function(){cur=t[0];open=false;draw()};nav.appendChild(b)});

  var AVIS_ST={"Favorable":"t-ok","Réservé":"t-warn","Défavorable":"t-bad"};
  var SAI_ST={"Reçue":"t-n","En examen":"t-warn","Close":"t-ok"};
  var CFG={
    avis:{titre:"Avis éthiques",pref:"AVIS",nouveau:"Nouvel avis",st:AVIS_ST,stLabel:"Sens de l'avis",
      f:[["objet","Objet de l'avis"],["service","Département concerné"]],txt:"Motivation de l'avis"},
    saisines:{titre:"Saisines",pref:"SAI",nouveau:"Nouvelle saisine",st:SAI_ST,stLabel:"Statut",
      f:[["objet","Objet de la saisine"],["service","Département demandeur"]],txt:"Exposé des faits"}
  };

  function draw(){
    nav.querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.t===cur)});
    var v=$("#view");
    if(cur==="accueil")v.innerHTML=accueil();
    else if(cur==="charte")v.innerHTML=charte();
    else if(cur==="comite")v.innerHTML=comite();
    else v.innerHTML=registre(cur);
    bind();
    window.scrollTo(0,0);
  }
  function accueil(){
    var last=DB.avis.concat(DB.saisines).sort(function(a,b){return b.ts-a.ts}).slice(0,4);
    return '<section class="hero"><div><p class="micro" style="color:var(--ink2)">HQ ETHOS · Installation - 73</p>'+
      '<h1>Comité d\'Éthique<em>Headquarter Ethos</em></h1>'+
      '<p class="quote">Philosophie. Moral Law. Ethics.<b>— DEVISE DU COMITÉ</b></p></div>'+
      '<img class="seal" src="logo.svg" alt="Sceau du Comité d\'Éthique"></section>'+
      '<div class="stats"><div class="stat"><span class="micro">Avis rendus</span><b>'+DB.avis.length+'</b></div>'+
      '<div class="stat"><span class="micro">Saisines reçues</span><b>'+DB.saisines.length+'</b></div>'+
      '<div class="stat"><span class="micro">En examen</span><b>'+DB.saisines.filter(function(s){return s.statut==="En examen"}).length+'</b></div></div>'+
      '<h2 class="sec">Activité récente</h2>'+
      (last.length?'<div class="list">'+last.map(function(e){return '<div class="row"><div class="hd"><span class="ref">'+esc(e.ref)+'</span><h3>'+esc(e.objet)+'</h3><span class="tag t-n">'+esc(e.statut)+'</span></div><div class="ft">'+esc(e.date)+' · '+esc(e.auteur)+'</div></div>'}).join("")+'</div>':'<div class="empty">Aucune activité pour le moment.</div>');
  }
  function charte(){
    var P=[["I","Philosophie","Le Comité interroge le sens et la finalité des actes de la Fondation avant de juger de leur efficacité. Toute décision doit pouvoir être expliquée par des raisons, et pas seulement par la nécessité."],
           ["II","Moral Law","Certaines limites ne se négocient pas. La loi morale prime sur l'opportunité : aucun objectif de confinement, de recherche ou de sécurité ne justifie de les franchir."],
           ["III","Ethics","L'éthique est une pratique : avis motivés, saisines instruites, réserves consignées. Le Comité conseille, alerte et rend compte, en toute indépendance des départements qu'il examine."]];
    return '<h2 style="font-size:2.8rem;margin-bottom:.4rem">Charte du Comité</h2><p class="micro" style="color:var(--ink2);margin-bottom:1.5rem">Texte provisoire — à remplacer par la charte officielle</p><div class="pill">'+
      P.map(function(p){return '<div class="pil"><span class="n">'+p[0]+'</span><h3>'+p[1]+'</h3><p>'+p[2]+'</p></div>'}).join("")+'</div>';
  }
  function comite(){
    var R=[["Direction du Comité","Niveau 1",[["Président du Comité","Garant de la Moral Law"],["Vice-président","Supplée le Président"]]],
           ["Conseil des Philosophes","Niveau 2",[["Philosophe en chef","Rédige la doctrine"],["Philosophe-conseiller","Examine les saisines"],["Rapporteur éthique","Instruit et présente les avis"]]],
           ["Greffe éthique","Niveau 3",[["Greffier du Comité","Tient le registre"],["Archiviste","Conserve les avis"]]]];
    return '<h2 style="font-size:2.8rem;margin-bottom:.4rem">Composition du Comité</h2><p class="micro" style="color:var(--ink2);margin-bottom:1.5rem">Grades provisoires — à remplacer par les vrais</p><div class="org">'+
      R.map(function(r){return '<div class="rk"><h3>'+r[0]+'<small>'+r[1]+'</small></h3><div class="gr">'+r[2].map(function(g){return '<div><b>'+g[0]+'</b><span>'+g[1]+'</span></div>'}).join("")+'</div></div>'}).join("")+'</div>';
  }
  function registre(k){
    var C=CFG[k],L=DB[k];
    var h='<div class="bar"><h2>'+C.titre+'</h2>'+(canW(k)?'<button class="btn" id="new" style="margin-left:auto">'+(open?"Fermer":"+ "+C.nouveau)+'</button>':'<span class="micro" style="margin-left:auto;color:var(--ink2)">Lecture seule pour votre grade</span>')+'</div>';
    if(open&&canW(k)){
      h+='<form class="f" id="frm"><div><label>'+C.f[0][1]+'</label><input name="objet" required></div>'+
        '<div><label>'+C.f[1][1]+'</label><input name="service"></div>'+
        '<div><label>'+C.stLabel+'</label><select name="statut">'+Object.keys(C.st).map(function(s){return '<option>'+s+'</option>'}).join("")+'</select></div>'+
        '<div><label>Rédigé par</label><input name="auteur" value="'+esc(SES.nom)+'"></div>'+
        '<div class="full"><label>'+C.txt+'</label><textarea name="texte"></textarea></div>'+
        '<div class="full"><button class="btn" type="submit">Enregistrer</button></div></form>';
    }
    if(!L.length)return h+'<div class="empty">Aucun élément enregistré.</div>';
    h+='<div class="list">'+L.slice().sort(function(a,b){return b.ts-a.ts}).map(function(e){
      return '<div class="row"><div class="hd"><span class="ref">'+esc(e.ref)+'</span><h3>'+esc(e.objet)+'</h3><span class="tag '+(C.st[e.statut]||"t-n")+'">'+esc(e.statut)+'</span></div>'+
        (e.service?'<div class="ft">Département : '+esc(e.service)+'</div>':'')+
        (e.texte?'<p>'+esc(e.texte)+'</p>':'')+
        '<div class="ft"><span>'+esc(e.date)+' · '+esc(e.auteur)+'</span>'+(canD()?'<button class="btn ghost sm del" data-id="'+e.id+'" style="margin-left:auto">Supprimer</button>':'')+'</div></div>'}).join("")+'</div>';
    return h;
  }
  function bind(){
    var nb=$("#new");if(nb)nb.onclick=function(){open=!open;draw()};
    var f=$("#frm");
    if(f)f.onsubmit=function(e){
      e.preventDefault();var C=CFG[cur],d=new FormData(f),L=DB[cur];
      var n=L.reduce(function(m,x){return Math.max(m,x.n||0)},0)+1,y=new Date().getFullYear();
      L.push({id:"i"+Date.now(),n:n,ts:Date.now(),ref:"ETH-"+C.pref+"-"+y+"-"+String(n).padStart(3,"0"),
        objet:d.get("objet").trim(),service:d.get("service").trim(),statut:d.get("statut"),auteur:d.get("auteur").trim()||SES.nom,
        texte:d.get("texte").trim(),date:new Date().toLocaleDateString("fr-FR")});
      persist();open=false;draw();
    };
    document.querySelectorAll(".del").forEach(function(b){b.onclick=function(){
      if(b.dataset.arm){DB[cur]=DB[cur].filter(function(x){return x.id!==b.dataset.id});persist();draw()}
      else{b.dataset.arm=1;b.textContent="Confirmer ?"}
    }});
  }
  draw();
}
</script>
</body>
</html>
